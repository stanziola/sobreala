{% extends "base.html" %}
{% block title %}{{ t('resend_title') }}{% endblock %}
{% block content %}
<div class="card card--narrow">
  <h1>{{ t('resend_title') }}</h1>
  <p class="lead">{{ t('resend_lead') }}</p>

  {% if errors.form %}<p class="error error--form">{{ errors.form }}</p>{% endif %}

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">{{ t('login_email') }}</label>
    <input id="email" name="email" type="email" value="{{ email }}"
           autocomplete="email" required>
    {% if errors.email %}<p class="error">{{ errors.email }}</p>{% endif %}
    <button class="btn" type="submit">{{ t('resend_submit') }}</button>
  </form>
</div>
{% endblock %}
