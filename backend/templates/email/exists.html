{#- Sent when someone tries to register an address that already has an account.
    The screen cannot say so without revealing who is registered. -#}
<!DOCTYPE html>
<html lang="es">
<body style="margin:0;padding:0;background:#F1F6FC;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#F1F6FC;padding:32px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="max-width:520px;background:#FFFFFF;border-radius:14px;
                  font-family:Helvetica,Arial,sans-serif;color:#0E1B2A;">
      <tr><td style="background:#3166A7;border-radius:14px 14px 0 0;padding:22px 28px;
                     color:#FFFFFF;font-size:20px;font-weight:bold;">{{ t('brand') }}</td></tr>
      <tr><td style="padding:28px;">
        <h1 style="margin:0 0 14px;font-size:22px;line-height:1.25;">{{ t('mail_exists_heading') }}</h1>
        <p style="margin:0 0 22px;font-size:16px;line-height:1.6;color:#51617A;">
          {{ t('mail_exists_body') }}</p>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
          <tr><td style="background:#31A9E8;border-radius:8px;">
            <a href="{{ link }}" style="display:inline-block;padding:13px 26px;
               font-size:16px;font-weight:bold;color:#0E1B2A;text-decoration:none;">
              {{ t('mail_exists_button') }}</a>
          </td></tr>
        </table>

        <p style="margin:22px 0 0;font-size:13px;color:#51617A;">
          {{ t('mail_exists_ignore') }}</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
